name: Build FlowVoice Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean up root extra main.dart
        run: |
          rm -f main.dart

      - name: Generate Android Project Files
        run: |
          flutter create . --platforms=android --org com.flowvoice.app

      - name: Configure Android permissions and Gradle
        run: |
          # Set minSdk to 21 and debug signing for release build
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

          # Inject permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c "
path = '$MANIFEST'
with open(path, 'r', encoding='utf-8') as f:
    content = f.read()

permissions = '''
    <uses-permission android:name=\"android.permission.INTERNET\"/>
    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>
    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>
'''

service = '''
        <service android:name=\"flutter.overlay.window.flutter_overlay_window.OverlayService\" android:exported=\"false\"/>
'''

if '<uses-permission' not in content:
    content = content.replace('<manifest', '<manifest' + permissions)

if '</application>' in content and 'OverlayService' not in content:
    content = content.replace('</application>', service + '\n    </application>')

with open(path, 'w', encoding='utf-8') as f:
    f.write(content)
"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowVoice_Mobile_APK
          path: build/app/outputs/flutter-apk/app-release.apk
