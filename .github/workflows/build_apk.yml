name: Build FlowVoice Mobile APK v45

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Remove root main.dart
        run: rm -f main.dart

      - name: Backup pubspec.yaml
        run: cp pubspec.yaml pubspec.yaml.bak || true

      - name: Generate Android Project
        run: flutter create . --platforms=android --org com.flowvoice.app

      - name: Restore pubspec.yaml & Add dependencies
        run: |
          if [ -f pubspec.yaml.bak ]; then
            cp pubspec.yaml.bak pubspec.yaml
          fi
          flutter pub add http shared_preferences flutter_overlay_window record path_provider cupertino_icons

      - name: Direct Clean Android Build Gradle Configuration (No Python/Base64 Hacks)
        run: |
          cat << 'GROOVY_EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }

          android {
              namespace "com.flowvoice.app"
              compileSdk 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.flowvoice.app"
                  minSdk 23
                  targetSdk 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          GROOVY_EOF

      - name: Clean Gradle Properties
        run: |
          sed -i '/android.enableR8/d' android/gradle.properties || true

      - name: Direct AndroidManifest Permissions Injection
        run: |
          cat << 'PY_EOF' > fix_manifest.py
          import os, re
          p = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(p):
              with open(p, 'r', encoding='utf-8') as f:
                  c = f.read()
              perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
'''
              service = '''        <service android:name="flutter.overlaywindow.flutter_overlay_window.OverlayService" android:exported="false"/>
'''
              if 'SYSTEM_ALERT_WINDOW' not in c:
                  c = re.sub(r'<application', perms + '    <application', c, count=1)
              if '</application>' in c and 'OverlayService' not in c:
                  c = c.replace('</application>', service + '    </application>')
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(c)
          PY_EOF
          python3 fix_manifest.py

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowVoice_Mobile_v45_APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Direct Download & QR Code Summary
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode || true
          echo "### 📱 FlowVoice Mobile v45 APK 빌드 성공!" >> $GITHUB_STEP_SUMMARY
          echo "아래 Artifacts 섹션에서 APK를 다운로드받아 설치하세요!" >> $GITHUB_STEP_SUMMARY
