name: Build FlowVoice Android APK v16 (QR Code Supported)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean up extra root files
        run: |
          rm -f main.dart

      - name: Backup original pubspec.yaml
        run: |
          cp pubspec.yaml pubspec.yaml.bak || true

      - name: Generate Android Project Files
        run: |
          flutter create . --platforms=android --org com.flowvoice.app

      - name: Restore original pubspec.yaml & Add dependencies
        run: |
          if [ -f pubspec.yaml.bak ]; then
            cp pubspec.yaml.bak pubspec.yaml
          fi
          flutter pub add http shared_preferences flutter_overlay_window record path_provider cupertino_icons

      - name: Configure Android SDK 34 & Gradle permissions & Disable Shrinker
        run: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle || true
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle || true

          cat << 'EOF' > configure_manifest.py
import os, re
path = 'android/app/src/main/AndroidManifest.xml'
if os.path.exists(path):
    with open(path, 'r', encoding='utf-8') as f:
        c = f.read()
    perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
'''
    service = '''        <service android:name="flutter.overlaywindow.flutter_overlay_window.OverlayService" android:exported="false"/>
'''
    if 'SYSTEM_ALERT_WINDOW' not in c:
        c = re.sub(r'<application', perms + '    <application', c, count=1)
    if '</application>' in c and 'OverlayService' not in c:
        c = c.replace('</application>', service + '    </application>')
    with open(path, 'w', encoding='utf-8') as f:
        f.write(c)
EOF
          python3 configure_manifest.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowVoice_Mobile_APK_v16
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Direct QR Code Link
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode || true
          echo "### 📱 FlowVoice Mobile APK v16 빌드 완료!" >> $GITHUB_STEP_SUMMARY
          echo "아래 Artifacts에서 APK를 바로 받거나 QR 코드를 스캔하세요!" >> $GITHUB_STEP_SUMMARY
