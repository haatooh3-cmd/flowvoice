name: Build FlowVoice Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean up root extra main.dart
        run: |
          rm -f main.dart

      - name: Backup original pubspec.yaml
        run: |
          cp pubspec.yaml pubspec.yaml.bak || true

      - name: Generate Android Project Files
        run: |
          flutter create . --platforms=android --org com.flowvoice.app

      - name: Restore original pubspec.yaml and Add dependencies
        run: |
          if [ -f pubspec.yaml.bak ]; then
            cp pubspec.yaml.bak pubspec.yaml
          fi
          flutter pub add http speech_to_text shared_preferences flutter_overlay_window cupertino_icons

      - name: Configure Android permissions and Gradle
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Inject Android permissions
        run: |
          python3 -c "import os; p='android/app/src/main/AndroidManifest.xml'; c=open(p).read(); perms='<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>'; open(p,'w').write(c.replace('<manifest', '<manifest>'+perms)) if '<uses-permission' not in c else None"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowVoice_Mobile_APK
          path: build/app/outputs/flutter-apk/app-release.apk
