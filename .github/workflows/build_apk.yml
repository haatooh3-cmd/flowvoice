name: Build FlowVoice Mobile APK v39

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Remove any root main.dart
        run: rm -f main.dart

      - name: Backup pubspec.yaml
        run: cp pubspec.yaml pubspec.yaml.bak || true

      - name: Generate Android Project
        run: flutter create . --platforms=android --org com.flowvoice.app

      - name: Restore pubspec.yaml & Add dependencies
        run: |
          if [ -f pubspec.yaml.bak ]; then
            cp pubspec.yaml.bak pubspec.yaml
          fi
          flutter pub add http shared_preferences flutter_overlay_window record path_provider cupertino_icons

      - name: Update Root android/build.gradle (Update R8 for Sealed Classes)
        run: |
          echo "" | base64 -d | python3 -

      - name: Update App android/app/build.gradle (Enable Core Desugaring & Clean Sdk 34)
        run: |
          echo "" | base64 -d | python3 -

      - name: Clean gradle.properties (Remove deprecated R8 options)
        run: |
          python3 -c "import os; p='android/gradle.properties'; open(p, 'w').write('\n'.join([l for l in open(p).readlines() if 'android.enableR8' not in l])) if os.path.exists(p) else None"

      - name: Update AndroidManifest permissions
        run: |
          python3 -c "import os, re; p='android/app/src/main/AndroidManifest.xml'; c=open(p).read() if os.path.exists(p) else ''; perms='<uses-permission android:name=\"android.permission.INTERNET\"/>\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n<uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>\n<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>\n'; s='<service android:name=\"flutter.overlaywindow.flutter_overlay_window.OverlayService\" android:exported=\"false\"/>\n'; c=c.replace('<application', perms+'<application') if 'SYSTEM_ALERT_WINDOW' not in c else c; c=c.replace('</application>', s+'</application>') if 'OverlayService' not in c else c; open(p,'w').write(c) if c else None"

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowVoice_Mobile_v39_APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Direct Download & QR Code Summary
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode || true
          echo "### 📱 FlowVoice Mobile v39 APK 빌드 완료!" >> $GITHUB_STEP_SUMMARY
          echo "아래 Artifacts 섹션에서 APK를 다운로드하거나 화면의 안내를 참조하세요!" >> $GITHUB_STEP_SUMMARY
