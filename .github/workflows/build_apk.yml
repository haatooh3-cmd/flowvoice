name: Build FlowVoice Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean up extra root files
        run: |
          rm -f main.dart

      - name: Backup original pubspec.yaml
        run: |
          cp pubspec.yaml pubspec.yaml.bak || true

      - name: Generate Android Project Files
        run: |
          flutter create . --platforms=android --org com.flowvoice.app

      - name: Restore original pubspec.yaml & Add dependencies
        run: |
          if [ -f pubspec.yaml.bak ]; then
            cp pubspec.yaml.bak pubspec.yaml
          fi
          flutter pub add http shared_preferences flutter_overlay_window record path_provider cupertino_icons

      - name: Configure Android SDK 34, Disable Shrinker & Gradle permissions
        run: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/minifyEnabled .*/minifyEnabled false/g' android/app/build.gradle || true
          sed -i 's/shrinkResources .*/shrinkResources false/g' android/app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

          python3 -c "import base64, os; path='android/app/src/main/AndroidManifest.xml'; code=base64.b64decode('').decode('utf-8'); exec(code)"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowVoice_Mobile_APK
          path: build/app/outputs/flutter-apk/app-release.apk
