name: Build FlowVoice Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (3.13.6 Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.6'
          channel: 'stable'

      - name: Clean up root extra main.dart
        run: rm -f main.dart

      - name: Backup original pubspec.yaml
        run: cp pubspec.yaml pubspec.yaml.bak || true

      - name: Generate Android Project Files
        run: flutter create . --platforms=android --org com.flowvoice.app

      - name: Restore original pubspec.yaml
        run: |
          if [ -f pubspec.yaml.bak ]; then
            cp pubspec.yaml.bak pubspec.yaml
          fi

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Configure Android Gradle
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Patch Plugin Namespaces
        run: |
          echo "" | base64 -d > patch.py
          python3 patch.py

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowVoice_Mobile_APK
          path: build/app/outputs/flutter-apk/app-release.apk
